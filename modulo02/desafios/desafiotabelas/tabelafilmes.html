<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Filmest</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      table {
        border-collapse: collapse;
      }

      caption {
        font-size: 1.3em;
        font-weight: bold;
        padding: 10px;
      }

      th, td {
        border: 1px solid black;
        padding: 10px;
      }

    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
            <th scope="col">Grupo</th>
            <th scope="col">Nomes</th>
            <th colspan="3" scope="colgroup">Filmes</th>
        </tr>
        </thead>
        <tbody>
            <tr>
            <th rowspan="3" scope="rowgroup">Mulheres</th>
            <td>Ana Maria Santos</td>
            <td>Allen</td>
            <td>Rambo</td>
            <Td>Vingadores</Td>
            </tr>
            <tr>
            <td class="junto">Beatriz Souza</td>
            <td class="junto">Hulk</td>
            <td class="junto">Inception</td>
            <td class="junto">Batman</td>
            </tr>
            <tr>
                <td class="junto">Cláudia Melo</td>
                <td class="junto">Oblivion</td>
                <td class="junto">Matrix</td>
                <td class="junto">Big Hero</td>
            </tr>
            <tr>
                <th rowspan="3" scope="rowgroup">Homens</th>
                <td>Bruno Mendonça</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
            </tr>
            <tr>
                <td>Daniel Lourenço</td>
                <td>Wall-E</td>
                <td>Oldboy</td>
                <td>Dangal</td>
            </tr>
            <tr>
                <td>Fabiano Mota</td>
                <td>Star Wars 5</td>
                <td>Taxi Driver</td>
                <td>Toy Story</td>
            </tr>

        </tbody>




    </table>
    
</body>
</html>
