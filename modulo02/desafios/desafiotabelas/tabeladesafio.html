<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Tabela</title>

    <style>

    * {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0px;
        padding: 0px;
        font-weight: bold;
    }

    table {
     padding: 10px;
     border-collapse: collapse;
     margin: 10px;

    }

    th {
        background-color: gray;
        color: white;
    }

    th.branca {
        background-color: white;
        color: black;
    }


    th, tr {
        padding: 10px;
        border: 2px solid black;
    }
    

    th.media {
        text-align: left;
    }

    td {
        border: 2px solid black;
    }

    td#final {
        background-color: gray;
        color: white;
    }

    </style>


</head>
<body>

    <table>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>

            <tr>
                <th rowspan="4" class="branca">Exatas</th>
                <td>Matémática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
             <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
            <th colspan="5" class="media">Média de Exatas</th>
            </tr>
            <tr>
                <th rowspan="2" class="branca">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tfoot>
                <th colspan="4" class="media" >Média de Humanas</th>
                <td id="final">0.0</td>
            </tfoot>

        </thead>





    </table>

    
</body>
</html>
